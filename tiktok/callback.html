<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Useful Small Systems · TikTok connected</title>
<style>body{font-family:system-ui,sans-serif;background:#F4EFE6;color:#191613;margin:0;display:grid;place-items:center;min-height:100vh}main{max-width:560px;padding:32px;text-align:center}
button{font-size:1.4rem;font-weight:700;background:#165C38;color:#fff;border:0;border-radius:999px;padding:18px 36px;cursor:pointer}p{line-height:1.5}#ok{color:#165C38;font-weight:700;min-height:1.5em}</style></head>
<body><main><h1 id="h">TikTok authorised</h1>
<p><button id="b">COPY CODE</button></p><p id="ok"></p>
<p>Then go back to the black window, press Ctrl+V and Enter. This page stores nothing and sends nothing anywhere.</p>
<script>const q=new URLSearchParams(location.search);const code=q.get('code'),err=q.get('error');
if(err){document.getElementById('h').textContent='TikTok returned an error: '+err+' '+(q.get('error_description')||'');document.getElementById('b').style.display='none';}
document.getElementById('b').onclick=async()=>{try{await navigator.clipboard.writeText(code||'');document.getElementById('ok').textContent='Copied. Now paste it into the black window.';}catch(e){prompt('Copy this code (Ctrl+C):',code);}};
</script></main></body></html>
